name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Lint (ruff)
              run: ruff check src/ tests/

            - name: Run tests
              run: pytest -v

            - name: Run pipeline in mock mode (no secrets required)
              run: python src/pipeline.py --mock --reset

            - name: Run pipeline against mock JIRA source (no secrets required)
              run: python src/pipeline.py --mock --reset --source jira
